name: Reel
options:
  bundleIdPrefix: com.gamojo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Reel:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Shared
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Reel
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "7"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.video
        NSScreenCaptureUsageDescription: Reel records the portion of the screen you select.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamojo.reel
        PRODUCT_NAME: Reel
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        COMBINE_HIDPI_IMAGES: YES

  ReelMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
      - path: Shared
      - path: Sources/Support/Theme.swift
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Reel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "8"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: Save your edited videos to Photos.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.mpeg-4
              - com.apple.quicktime-movie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamojo.reel.mobile
        PRODUCT_NAME: ReelMobile
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

  ReelMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/iOS]
    dependencies:
      - target: ReelMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
  ReelMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/iOSUI]
    dependencies:
      - target: ReelMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  ReelMobile:
    build:
      targets:
        ReelMobile: all
    test:
      targets:
        - ReelMobileTests
        - ReelMobileUITests
